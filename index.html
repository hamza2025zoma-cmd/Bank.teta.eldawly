<script>
const THEMES=[["purple","Purple Clouds","clouds","#2e1065"],["classic","Classic","orbs","#1b1464"],["aurora","Aurora","none","#0b1020"],["ocean","Ocean","bubbles","#03045e"],["candy","Candy","none","#ffd6e5"],["space","Space","stars","#05010f"],["gold","Black Gold","none","#0b0b0b"],["sky","Cotton Sky","clouds","#7dd3fc"],["neon","Neon","none","#07060f"],["sunset","Sunset","clouds","#4a1942"],["mint","Mint Forest","bubbles","#064e3b"],["rose","Rose Gold","orbs","#4c0519"],["midnight","Midnight","stars","#020617"],["lava","Lava","clouds","#450a0a"]];
function applyTheme(k){
  let i=THEMES.findIndex(t=>t[0]===k);if(i<0)i=0;
  const t=THEMES[i],h=document.documentElement;
  h.setAttribute("data-theme",t[0]);h.setAttribute("data-fx",t[2]);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute("content",t[3]);
  
  return i;
}
let themeKey="purple";try{themeKey=localStorage.getItem("bank_theme")||"purple"}catch(e){}
applyTheme(themeKey);
</script>

<script>
(function(){

  applyTheme(themeKey);

    const cur=THEMES.findIndex(t=>t[0]===document.documentElement.getAttribute("data-theme"));

  });
})();

// ===== Payroll: Thursday & Friday 3000 EGP at 11:00 Cairo time =====
const PAY_AMT=3000,PAY_HOUR=11;let payBusy=false;
function cairoNow(){const p={};new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Cairo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return {y:+p.year,m:+p.month,d:+p.day,h:+p.hour}}
async function claimPayout(key){const ref=db.collection("settings").doc("payouts");return db.runTransaction(async t=>{const d=await t.get(ref),paid=(d.exists&&d.data().paid)||{};if(paid[key])return false;t.set(ref,{paid:{[key]:Date.now()}},{merge:true});return true})}
async function checkPayouts(){
  if(payBusy||!db)return;payBusy=true;
  try{
    const n=cairoNow(),base=Date.UTC(n.y,n.m-1,n.d);
    for(const k of [-1,0]){
      const dd=new Date(base+k*864e5),wd=dd.getUTCDay();
      if(wd!==4&&wd!==5)continue;if(k===0&&n.h<PAY_HOUR)continue;
      const key=dd.toISOString().slice(0,10);if(!(await claimPayout(key)))continue;
      const snap=await db.collection("accounts").get(),batch=db.batch(),now=Date.now(),note=wd===4?"Thursday salary":"Friday salary";
      snap.docs.forEach((d,i)=>{const bal=Number(d.data().balance||0),debt=bal<0?-bal:0;
        const txt=debt?note+" — debt deducted "+fmt(debt)+" = net "+fmt(PAY_AMT-debt)+" of "+fmt(PAY_AMT):note;
        batch.update(d.ref,{balance:firebase.firestore.FieldValue.increment(PAY_AMT)});
        batch.set(db.collection("tx").doc("pay"+key+"_"+d.id),{from:ADM.name,fromId:ADM.id,to:d.data().name,toId:d.id,amt:PAY_AMT,note:txt,t:now+i})});
      await batch.commit();
    }
  }catch(e){console.error("payout:",e)}
  payBusy=false;
}
function receipt(t){return new Promise(r=>{const c=document.createElement("canvas");c.width=600;c.height=760;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,600,760);g.addColorStop(0,"#2e1065");g.addColorStop(1,"#a78bfa");x.fillStyle=g;x.fillRect(0,0,600,760);x.fillStyle="rgba(255,255,255,.16)";x.fillRect(30,30,540,700);x.fillStyle="#fff";x.textAlign="center";x.font="800 34px sans-serif";x.fillText("🏦 "+ADMIN_NAME,300,100);x.font="600 22px sans-serif";x.fillText("Transfer Receipt",300,140);x.font="800 58px sans-serif";x.fillText(fmt(t.amt)+" EGP",300,250);x.textAlign="left";[["From",t.from],["To",t.to],["Reason",t.note||"—"],["Date",when(t)],["Ref",t.id]].forEach((l,i)=>{x.font="500 20px sans-serif";x.globalAlpha=.7;x.fillText(l[0],70,340+i*74);x.globalAlpha=1;x.font="700 24px sans-serif";x.fillText(String(l[1]).slice(0,34),70,372+i*74)});c.toBlob(r,"image/png")})}

function shrink(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6))};im.src=fr.result};fr.readAsDataURL(file)})}

      if(val("b-pw")!==ADMIN_PASS)return say("Wrong bank password",false);
      const v=Math.floor(Number(val("b-amt"))),list=S.accs.filter(x=>!S.pick.length||S.pick.includes(x.id));
      if(!(v>0)||!list.length)return say("Enter a valid amount",false);
      const FV=firebase.firestore.FieldValue,batch=db.batch(),why=val("b-why").trim()||"Deposit from bank";
      list.forEach(x=>{batch.update(db.collection("accounts").doc(x.id),{balance:FV.increment(v)});const [r,d]=mkTx(ADM,x,v,why);batch.set(r,d)});
      await batch.commit();return say("Sent "+fmt(v)+" EGP to "+list.length+" account(s) ✅");
    }
    if(a==="login"){
      if(val("lg-acc")===BANK_ID){if(val("lg-pin").trim()!==ADMIN_PASS)return say("Wrong password",false);S.admin=true;S.me=null;save();S.msg="";return render()}
      const x=byId(val("lg-acc"));if(!x)return say("Choose your name",false);
      const p=val("lg-pin").trim();
      if(x.pin){if(x.pin!==p)return say("Wrong password",false)}
      else{if(p.length<3)return say("Password must be at least 3 characters",false);if(p!==val("lg-pin2").trim())return say("Passwords don't match",false);await db.collection("accounts").doc(x.id).update({pin:p})}
      S.me=x.id;S.admin=false;save();S.msg="";return render();
    }
    if(a==="showpins"){if(val("pinpw")!==ADMIN_PASS)return say("Wrong bank password",false);S.pins=true;S.msg="";return render()}
    if(a==="hidepins"){S.pins=false;return render()}
    if(a==="logout"){S.me=null;S.admin=false;S.pins=false;S.tab="home";save();S.msg="";return render()}
    if(a==="create"){
      const name=val("n-name").trim(),pin=val("n-pin").trim(),bal=val("n-bal").trim()===""?10000:Math.max(0,Math.floor(Number(val("n-bal"))||0));
      if(!name)return say("Enter a name",false);
      if(S.accs.length>=MAX)return say("Limit reached: 10 accounts",false);
      if(byName(name))return say("That name already exists",false);
      await db.collection("accounts").doc("a"+Date.now().toString(36)).set({name,pin,balance:bal,t:Date.now()});
      return say("Account for "+name+" created ✅");
    }
    if(a==="transfer"||a==="transferall"){
      const me=byId(S.me),amt=Math.floor(Number(val("tr-a"))),why=val("tr-r").trim();
      if(!(amt>0))return say("Enter a valid amount",false);
      let list;
      if(a==="transferall")list=S.accs.filter(x=>x.id!==me.id);
      else{const to=byName(val("tr-n"));if(!to)return say("No account with that name",false);if(to.id===me.id)return say("You can't send money to yourself",false);list=[to]}
      const FV=firebase.firestore.FieldValue,batch=db.batch();
      batch.update(db.collection("accounts").doc(me.id),{balance:FV.increment(-amt*list.length)});
      list.forEach(x=>{batch.update(db.collection("accounts").doc(x.id),{balance:FV.increment(amt)});const [r,d]=mkTx(me,x,amt,why);batch.set(r,d)});
      await batch.commit();
      return say("Sent "+fmt(amt)+" EGP to "+(list.length>1?"everyone ("+list.length+")":list[0].name)+" ✅");
    }
    const x=byId(id);
    if(x&&x.pin&&val("p-"+id).trim()!==x.pin)return say("Enter "+x.name+"'s correct password first",false);
    if(a==="clr"){await db.collection("accounts").doc(id).update({pin:""});return say(x.name+"'s password cleared ✅")}
    if(a==="del"){if(!x||!confirm(S.lang==="ar"?"تحذف حساب "+x.name+"؟":"Delete "+x.name+"'s account?"))return;await db.collection("accounts").doc(id).delete();return say("Deleted")}
    if(a==="add"||a==="sub"||a==="set"){
      const v=Math.floor(Number(val("v-"+id)));if(!(v>=0)||isNaN(v))return say("Enter a valid amount",false);
      const why=val("why").trim(),nb=a==="add"?x.balance+v:a==="sub"?Math.max(0,x.balance-v):v;
      await db.collection("accounts").doc(id).update({balance:nb});
      if(a==="add")await logTx(ADM,x,v,why||"Deposit by bank");
      if(a==="sub")await logTx(x,ADM,Math.max(0,Math.min(v,x.balance)),why||"Withdrawal by bank");
      return say(x.name+"'s balance updated ✅");
    }
  }catch(e){say("Something went wrong: "+(e&&e.message||e),false)}
}
document.addEventListener("click",e=>{
  if(window.Notification&&Notification.permission==="default")Notification.requestPermission();
  if(e.target.closest("#lg"))return setLang(S.lang==="ar"?"en":"ar");
  if(e.target.closest("#ttl")){taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,2000);if(taps>=5){taps=0;render()}}
  const b=e.target.closest("[data-act]");if(b)act(b.dataset.act,b.dataset.id);
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="lg-acc"){S.sel=t.value;S.msg="";render()}
  else if(t.id==="cv"){S.chat=t.value;render()}
  else if(t.classList.contains("rc")){S.pick=t.checked?[...S.pick,t.value]:S.pick.filter(i=>i!==t.value)}
  else if(t.id==="img"&&t.files[0]){try{await sendMsg("",await shrink(t.files[0]))}catch(er){say("Couldn't send image",false)}t.value=""}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="cm")act("send")});

try{const c=JSON.parse(localStorage.getItem("fb_cfg")||"null");if(c)firebaseConfig=c}catch(e){}
const showFatal=m=>{$("#app").innerHTML='<div class="glass msg" style="color:var(--no)">'+esc(m)+'<br><br><button id="s-reset">Reset setup</button></div>';const r=$("#s-reset");if(r)r.onclick=()=>{localStorage.removeItem("fb_cfg");location.reload()}};
const FAMILY=["Hamza","Omar","Farah","Malak","Rana","Ahmed"];
(async()=>{
  try{
    if(typeof firebase==="undefined")throw new Error("Firebase failed to load. Check your internet connection.");
    firebase.initializeApp(firebaseConfig);db=firebase.firestore();
    let seeded=false;const first={};
    const watch=(name,key,onNew)=>db.collection(name).onSnapshot(snap=>{
      S[key]=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.t||0)-(b.t||0));
      if(first[name]&&onNew)snap.docChanges().forEach(c=>{if(c.type==="added")onNew({id:c.doc.id,...c.doc.data()})});
      first[name]=1;if(key==="tx")S.tx.reverse();render();
    },e=>console.error(name+":",e));
    db.collection("accounts").onSnapshot(snap=>{
      if(snap.empty&&!seeded){seeded=true;FAMILY.forEach((name,i)=>db.collection("accounts").doc("family_"+name.toLowerCase()).set({name,pin:"",balance:0,t:Date.now()+i}).catch(e=>showFatal("Can't write to Firestore: "+e.message)))}
      S.accs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.t||0)-(b.t||0));
      S.ready=true;render();
      if(!window._p){window._p=1;checkPayouts();setInterval(checkPayouts,60000);
        watch("tx","tx",t=>{const M=cur();if(M&&(!t.id.startsWith("pay")||t.toId===M.id))ping("Bank Account",t.from+" sent "+fmt(t.amt)+" EGP to "+t.to)});
        watch("alerts","alerts",a=>{const M=cur();if(M&&(S.admin||a.to==="all"||a.to.includes(M.id)))ping("📢 Bank alert",a.text)});
        watch("groups","groups");
        watch("msgs","msgs",m=>{const M=cur();if(!M||m.fromId===M.id)return;const g=S.groups.find(x=>x.id===m.to);if(m.to===M.id||(g&&(S.admin||g.members.includes(M.id))))ping("💬 "+m.from,m.text||"📷 Photo")});
      }
    },e=>showFatal("Error loading accounts: "+e.message+" — Firestore rules may be blocking reads"));
  }catch(e){showFatal("Couldn't start the bank: "+(e&&e.message||e))}
})();
